invalid-mod-id: "{prefix}&c\"{mod}\" is not a valid mod id."
invalid-id: "{prefix}&c{error}."

everything-back-on: "{prefix}&aEverything in {mod} is back on {where}.{told}"
already-off: "{prefix}&e{target} is already off {where}.{reason}"
switched-off: "{prefix}&aSwitched {target} off {where}.{told}"
