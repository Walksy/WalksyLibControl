help-header: "&6WalksyLibControl &7- /{label}"
help-intro: "&7Mod and feature ids come from the mod itself: look for allowOptOutFromServer in its code."
help-disable: "&f/{label} disable <modId> [feature]&7  switch off for everyone"
help-disablewithreason: "&f/{label} disablewithreason <modId> [feature] \"<reason>\"&7  ...and tell players why"
help-enable: "&f/{label} enable <modId> [feature|*]&7  switch back on for everyone"
help-enablewithreason: "&f/{label} enablewithreason <modId> [feature|*] \"<reason>\"&7  ...and tell players why"
help-status: "&f/{label} status [player]&7  what is off, and for whom"
help-player-edit: "&f/{label} player <player|@sel> disable|enable[withreason] <modId> [feature] ...&7  just for them"
help-player-apply: "&f/{label} player <player|@sel> apply|remove <ruleset>&7  e.g. on joining/leaving a gamemode"
help-player-clear: "&f/{label} player <player|@sel> clear&7  drop everything given to them"
help-ruleset: "&f/{label} ruleset list | create <id> | delete <id>&7  named lists, e.g. one per gamemode"
help-ruleset-edit: "&f/{label} ruleset <id> disable|enable[withreason] <modId> [feature] ...&7  edit one"
help-ruleset-more: "&f/{label} ruleset <id> clear | world add|remove <world> | permission <node|none>"
help-reload: "&f/{label} reload&7  re-read config.yml, messages.yml and rules.yml"
