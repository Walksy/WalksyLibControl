not-off: "{prefix}&e{target} was not switched off {where}.{hint}"
switched-on: "{prefix}&aSwitched {target} back on {where}.{told}"
obeyed-by: "&7WalksyLib clients online that allow this: {obeying}/{clients}"

who-players: "{count} players"
player-cleared-mod: "{prefix}&aCleared {who}'s own restrictions on {mod}.{told}"
player-switched-off: "{prefix}&aSwitched {target} off for {who}.{told}"
player-switched-on: "{prefix}&aSwitched {target} back on for {who}.{told}"
player-enable-note: "&7This only lifts restrictions given to the player directly; rule sets in force still apply. See /{label} status <player>."
player-applied: "{prefix}&aApplied {rule-set} to {who}."
player-removed: "{prefix}&aRemoved {rule-set} from {who}."
player-cleared: "{prefix}&aCleared everything given to {who} directly."
global-always-applies: "{prefix}&cThe global rule set is in force for everyone already."
bad-selector: "{prefix}&cBad selector {selector}: {error}"
selectors-unsupported: "{prefix}&cThis server can't use selectors here - name the player instead."
no-match: "{prefix}&c{selector} matched no players."
not-online: "{prefix}&c{player} is not online."

