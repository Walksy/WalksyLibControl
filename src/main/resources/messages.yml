rule-set-exists: "{prefix}&cRule set {id} already exists."
rule-set-created: "{prefix}&aCreated rule set {id}. Add to it with /{label} ruleset {id} disable <modId> [feature]."
rule-set-global-undeletable: "{prefix}&cThe global rule set can't be deleted; empty it with /{label} ruleset global clear."
rule-set-deleted: "{prefix}&aDeleted rule set {id}."
rule-set-missing: "{prefix}&cNo rule set {id}. Create it with /{label} ruleset create {id}."
rule-set-cleared: "{prefix}&aRule set {id} no longer switches anything off."
rule-set-permission-bound: "{prefix}&aRule set {id} is now in force for everyone with {permission}."
rule-set-permission-unbound: "{prefix}&aRule set {id} is no longer bound to a permission."
rule-set-world-added: "{prefix}&aRule set {id} is now in force for everyone in {world}."
rule-set-world-not-loaded: "&7No world named {world} is loaded right now; it applies once one is."
rule-set-world-removed: "{prefix}&aRule set {id} is no longer tied to {world}."
rule-set-global-unbindable: "{prefix}&cThe global rule set is in force for everyone; it can't be tied to worlds, permissions or players."

