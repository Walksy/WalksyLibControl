prefix: "&8[&dWalksyLibControl&8]&r "

no-permission: "{prefix}&cYou don't have permission to do that."
usage: "{prefix}&cUsage: /{usage}"
reloaded: "{prefix}&aReloaded config.yml, messages.yml and rules.yml."

where-global: "for everyone"
where-rule-set: "in rule set {rule-set}"
